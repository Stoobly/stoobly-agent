# The following example matches requests for GET /users/d+ (e.g. /users/1) with the contents of user-1.json
# Assumes that 'user-1.json' is created in a 'fixtures' folder in the same directory as this file
# Optional scenario_keys limits a fixture to specific scenarios (raw key or scenario UUID).
# Optional scenario_names limits a fixture to specific scenarios by name.
# When both are set, either a key/UUID or name match is enough.
# Optional headers are merged into the mock response (override defaults on conflict).
# Optional status_code overrides the default 200.
#GET:
#  /users/d+:
#    path: ./fixtures/user-1.json
#    status_code: 200
#    headers:
#      Content-Type: application/json
#      Cache-Control: no-store
#    scenario_keys:
#      - <scenario-key-or-uuid>
#    scenario_names:
#      - <scenario-name>
