services:
  entrypoint.cypress:
    build:
      args:
        CYPRESS_IMAGE: ${CYPRESS_IMAGE}
        GOLANG_IMAGE: ${GOLANG_IMAGE}
        GOSU_VERSION: ${GOSU_VERSION}
        USER_ID: ${USER_ID}
      context: ./
      dockerfile: ./.Dockerfile.cypress
    command: ${CYPRESS_COMMAND:-npx cypress run --project .}
    depends_on:
      entrypoint.init:
        condition: service_completed_successfully
    networks:
      - "app.ingress"
    profiles:
      - ${WORKFLOW_NAME}
    volumes:
      - ${CONTEXT_DIR}:/home/stoobly