services:
  entrypoint.playwright:
    build:
      args:
        GOLANG_IMAGE: ${GOLANG_IMAGE}
        GOSU_VERSION: ${GOSU_VERSION}
        PLAYWRIGHT_IMAGE: ${PLAYWRIGHT_IMAGE}
        USER_ID: ${USER_ID}
      context: ./
      dockerfile: ./.Dockerfile.playwright
    command: ${PLAYWRIGHT_COMMAND:-npx playwright test --reporter dot}
    depends_on:
      entrypoint.init:
        condition: service_completed_successfully
    networks:
      - "app.ingress"
    profiles:
      - ${WORKFLOW_NAME}
    volumes:
      - ${CONTEXT_DIR}:/home/stoobly